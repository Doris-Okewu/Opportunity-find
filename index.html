<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opportunity Find — Discover verified opportunities</title>
    <meta
      name="description"
      content="Opportunity Find helps students, graduates, NYSC members, and career switchers discover verified jobs, internships, scholarships, and programs matched to their career goals."
    />
    <script>
      (function () {
        var stored = localStorage.getItem('opportunity-find-theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
